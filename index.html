<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>두더지 잡기 · 땅굴 소동</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #30251f;
      --muted: #806f63;
      --cream: #fff8ea;
      --paper: rgba(255, 253, 247, .88);
      --orange: #f0784a;
      --orange-dark: #d6532e;
      --yellow: #ffd768;
      --brown: #8a5a3d;
      --hole: #5c392b;
      --green: #86b86a;
      --shadow: 0 24px 70px rgba(94, 55, 26, .18);
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: "Pretendard", "Noto Sans KR", system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(255, 218, 117, .7), transparent 30%),
        radial-gradient(circle at 90% 8%, rgba(137, 195, 120, .55), transparent 28%),
        linear-gradient(150deg, #f9c779 0%, #f7ab70 45%, #ed8d6e 100%);
      overflow-x: hidden;
    }

    body::before, body::after {
      position: fixed;
      z-index: -1;
      content: "";
      width: 220px;
      height: 220px;
      border: 24px solid rgba(255, 255, 255, .16);
      border-radius: 50%;
      filter: blur(1px);
    }
    body::before { top: 18%; left: -100px; }
    body::after { right: -90px; bottom: 5%; }

    .app {
      width: min(100% - 32px, 920px);
      margin: 0 auto;
      padding: 32px 0 46px;
    }

    .hero {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin: 0 0 8px;
      color: #8d4d2d;
      font-size: .78rem;
      font-weight: 900;
      letter-spacing: .14em;
    }
    .eyebrow::before { content: "✦"; color: #fff5bd; font-size: 1.1rem; }
    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 6vw, 4.2rem);
      line-height: .98;
      letter-spacing: -.07em;
    }
    .tagline {
      max-width: 420px;
      margin: 12px 0 0;
      color: #684e41;
      font-weight: 600;
      line-height: 1.6;
    }
    .mascot {
      flex: 0 0 auto;
      width: 112px;
      height: 112px;
      display: grid;
      place-items: center;
      border: 7px solid #fff1c8;
      border-radius: 42% 58% 50% 50%;
      background: #9b6646;
      box-shadow: 0 14px 0 rgba(111, 63, 40, .18), inset 0 8px 0 rgba(255, 255, 255, .12);
      font-size: 4rem;
      transform: rotate(7deg);
    }

    .panel {
      padding: clamp(18px, 4vw, 30px);
      border: 1px solid rgba(255, 255, 255, .75);
      border-radius: 30px;
      background: var(--paper);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 22px;
    }
    .stat {
      min-width: 0;
      padding: 14px 16px;
      border-radius: 18px;
      background: #fffaf0;
      border: 1px solid #f4e7cf;
    }
    .stat-label {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .08em;
    }
    .stat-value { font-size: clamp(1.35rem, 4vw, 1.9rem); font-weight: 950; }
    #time { color: var(--orange-dark); }
    #combo { color: #a66b14; }

    .game-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 220px;
      gap: 24px;
      align-items: center;
    }
    .board-wrap {
      position: relative;
      padding: clamp(14px, 3vw, 26px);
      border-radius: 25px;
      background: linear-gradient(145deg, #8ec56e, #68a452);
      box-shadow: inset 0 3px 0 rgba(255,255,255,.25), inset 0 -8px 0 rgba(55, 105, 46, .16);
    }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(10px, 2.2vw, 18px);
    }
    .hole {
      position: relative;
      aspect-ratio: 1;
      min-width: 0;
      padding: 0;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      background: radial-gradient(ellipse at center, #3e271e 0 48%, #6e432e 51% 68%, #9b6a45 70% 100%);
      box-shadow: inset 0 10px 6px rgba(0,0,0,.18), 0 5px 0 rgba(62, 102, 46, .45);
      overflow: hidden;
    }
    .hole:focus-visible { outline: 5px solid #fff4b0; outline-offset: 3px; }
    .hole::after {
      position: absolute;
      inset: 0;
      content: "";
      opacity: 0;
      border-radius: inherit;
      background: rgba(255, 242, 166, .35);
      transition: opacity .15s;
    }
    .hole:hover::after { opacity: .32; }
    .mole {
      position: absolute;
      z-index: 1;
      left: 50%;
      bottom: -58%;
      width: 62%;
      aspect-ratio: .8;
      border-radius: 50% 50% 38% 38%;
      background: linear-gradient(145deg, #bd825d, #865237);
      box-shadow: inset 12px 7px 0 rgba(255,255,255,.14), inset -7px -8px 0 rgba(75, 37, 27, .14);
      transform: translateX(-50%);
      transition: bottom .16s cubic-bezier(.2,.85,.35,1.25);
    }
    .mole::before, .mole::after {
      position: absolute;
      top: 30%;
      width: 13%;
      aspect-ratio: 1;
      content: "";
      border-radius: 50%;
      background: #2d211d;
      box-shadow: 0 1px 0 2px rgba(255,255,255,.25);
    }
    .mole::before { left: 25%; }
    .mole::after { right: 25%; }
    .mole .nose {
      position: absolute;
      left: 50%;
      top: 47%;
      width: 21%;
      aspect-ratio: 1.2;
      border-radius: 50%;
      background: #f49b8b;
      transform: translateX(-50%);
    }
    .hole.active .mole { bottom: -7%; }
    .hole.whacked .mole { animation: bonk .23s ease-out; }
    .hole.whacked::before {
      position: absolute;
      z-index: 3;
      top: 8%;
      left: 50%;
      content: "+10";
      color: #fff;
      font-size: 1.2rem;
      font-weight: 950;
      text-shadow: 0 2px 4px rgba(79, 37, 20, .5);
      transform: translateX(-50%) rotate(-8deg);
      animation: float-up .45s ease-out forwards;
    }
    @keyframes bonk { 50% { transform: translateX(-50%) rotate(-12deg) scale(.9); } }
    @keyframes float-up { to { top: -14%; opacity: 0; } }

    .side {
      display: grid;
      gap: 16px;
    }
    .message {
      min-height: 92px;
      padding: 15px 16px;
      border-radius: 18px;
      color: #6b4b34;
      background: #fff3cc;
      font-size: .93rem;
      font-weight: 700;
      line-height: 1.5;
    }
    .message strong { display: block; margin-bottom: 3px; color: var(--ink); font-size: 1.05rem; }
    .start {
      width: 100%;
      padding: 17px 18px;
      border: 0;
      border-radius: 17px;
      color: #fff;
      background: linear-gradient(135deg, var(--orange), var(--orange-dark));
      box-shadow: 0 6px 0 #b64327;
      cursor: pointer;
      font: inherit;
      font-weight: 950;
      transition: transform .12s, box-shadow .12s, filter .12s;
    }
    .start:hover { filter: brightness(1.07); transform: translateY(-2px); }
    .start:active { transform: translateY(4px); box-shadow: 0 2px 0 #b64327; }
    .start:focus-visible { outline: 4px solid #f4c85e; outline-offset: 3px; }
    .tip {
      color: #8d7466;
      font-size: .78rem;
      line-height: 1.5;
    }
    .tip b { color: var(--orange-dark); }

    @media (max-width: 680px) {
      .app { width: min(100% - 20px, 520px); padding-top: 22px; }
      .hero { align-items: center; }
      .mascot { width: 70px; height: 70px; border-width: 5px; font-size: 2.5rem; }
      .tagline { font-size: .88rem; }
      .panel { padding: 14px; border-radius: 24px; }
      .game-layout { grid-template-columns: 1fr; }
      .side { grid-template-columns: 1fr 1fr; align-items: stretch; }
      .message { grid-column: 1 / -1; min-height: auto; }
      .tip { grid-column: 1 / -1; }
    }
    @media (max-width: 390px) {
      .stats { gap: 7px; }
      .stat { padding: 11px 10px; }
      .stat-label { font-size: .64rem; }
      .stat-value { font-size: 1.3rem; }
      .side { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">MOLE MAYHEM</p>
        <h1>두더지 잡기!</h1>
        <p class="tagline">땅굴에서 빼꼼 나온 두더지를 재빨리 눌러보세요.<br>30초 안에 최고 점수에 도전!</p>
      </div>
      <div class="mascot" aria-hidden="true">🐹</div>
    </header>

    <section class="panel" aria-label="두더지 잡기 게임">
      <div class="stats" aria-label="게임 기록">
        <div class="stat"><span class="stat-label">점수</span><span id="score" class="stat-value">0</span></div>
        <div class="stat"><span class="stat-label">남은 시간</span><span id="time" class="stat-value">30초</span></div>
        <div class="stat"><span class="stat-label">콤보</span><span id="combo" class="stat-value">0</span></div>
      </div>

      <div class="game-layout">
        <div class="board-wrap">
          <div id="board" class="board" aria-label="두더지 구멍 9개">
            <button class="hole" type="button" data-index="0" aria-label="첫 번째 구멍"><span class="mole"><span class="nose"></span></span></button>
            <button class="hole" type="button" data-index="1" aria-label="두 번째 구멍"><span class="mole"><span class="nose"></span></span></button>
            <button class="hole" type="button" data-index="2" aria-label="세 번째 구멍"><span class="mole"><span class="nose"></span></span></button>
            <button class="hole" type="button" data-index="3" aria-label="네 번째 구멍"><span class="mole"><span class="nose"></span></span></button>
            <button class="hole" type="button" data-index="4" aria-label="다섯 번째 구멍"><span class="mole"><span class="nose"></span></span></button>
            <button class="hole" type="button" data-index="5" aria-label="여섯 번째 구멍"><span class="mole"><span class="nose"></span></span></button>
            <button class="hole" type="button" data-index="6" aria-label="일곱 번째 구멍"><span class="mole"><span class="nose"></span></span></button>
            <button class="hole" type="button" data-index="7" aria-label="여덟 번째 구멍"><span class="mole"><span class="nose"></span></span></button>
            <button class="hole" type="button" data-index="8" aria-label="아홉 번째 구멍"><span class="mole"><span class="nose"></span></span></button>
          </div>
        </div>
        <aside class="side">
          <div id="message" class="message" aria-live="polite"><strong>준비됐나요?</strong>시작 버튼을 누르면 두더지가 나타나요!</div>
          <button id="start" class="start" type="button">게임 시작</button>
          <p class="tip"><b>TIP</b> 빠르게 연속으로 잡으면 콤보 보너스를 받아요. 빗나가도 너무 낙심하지 마세요!</p>
        </aside>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const GAME_TIME = 30;
      const holes = [...document.querySelectorAll('.hole')];
      const scoreEl = document.querySelector('#score');
      const timeEl = document.querySelector('#time');
      const comboEl = document.querySelector('#combo');
      const messageEl = document.querySelector('#message');
      const startButton = document.querySelector('#start');

      let score = 0;
      let timeLeft = GAME_TIME;
      let combo = 0;
      let activeIndex = -1;
      let previousIndex = -1;
      let gameRunning = false;
      let moleTimer = null;
      let clockTimer = null;

      const setMessage = (title, text) => {
        messageEl.innerHTML = `<strong>${title}</strong>${text}`;
      };

      const updateStats = () => {
        scoreEl.textContent = score.toLocaleString('ko-KR');
        timeEl.textContent = `${timeLeft}초`;
        comboEl.textContent = combo;
      };

      const hideMole = () => {
        if (activeIndex >= 0) holes[activeIndex].classList.remove('active');
        activeIndex = -1;
      };

      const chooseHole = () => {
        const candidates = holes.map((_, index) => index).filter(index => index !== previousIndex);
        return candidates[Math.floor(Math.random() * candidates.length)];
      };

      const showMole = () => {
        if (!gameRunning) return;
        hideMole();
        activeIndex = chooseHole();
        previousIndex = activeIndex;
        holes[activeIndex].classList.add('active');
        const nextDelay = Math.max(430, 980 - Math.min(score, 30) * 11);
        moleTimer = window.setTimeout(showMole, nextDelay);
      };

      const endGame = () => {
        gameRunning = false;
        window.clearTimeout(moleTimer);
        window.clearInterval(clockTimer);
        hideMole();
        startButton.textContent = '다시 하기';
        setMessage('게임 끝!', `최종 점수는 <b>${score.toLocaleString('ko-KR')}점</b>이에요. 다시 도전해볼까요?`);
        startButton.focus();
      };

      const startGame = () => {
        window.clearTimeout(moleTimer);
        window.clearInterval(clockTimer);
        score = 0;
        combo = 0;
        timeLeft = GAME_TIME;
        activeIndex = -1;
        previousIndex = -1;
        gameRunning = true;
        startButton.textContent = '게임 다시 시작';
        setMessage('잡아라!', '두더지가 나타났어요. 어서 눌러보세요!');
        updateStats();
        showMole();
        clockTimer = window.setInterval(() => {
          timeLeft -= 1;
          updateStats();
          if (timeLeft <= 0) endGame();
        }, 1000);
      };

      const whack = (event) => {
        const hole = event.currentTarget;
        const index = Number(hole.dataset.index);
        if (!gameRunning) return;
        if (index === activeIndex) {
          combo += 1;
          score += 10 + Math.max(0, combo - 1) * 2;
          hole.classList.remove('active');
          hole.classList.remove('whacked');
          // Force a reflow so the hit animation also plays on consecutive hits.
          void hole.offsetWidth;
          hole.classList.add('whacked');
          window.setTimeout(() => hole.classList.remove('whacked'), 300);
          setMessage(combo >= 3 ? `${combo} 콤보!` : '정확해요!', combo >= 3 ? '손이 아주 빠른데요?' : '좋아요, 다음 두더지도 노려보세요!');
          updateStats();
          window.clearTimeout(moleTimer);
          showMole();
        } else {
          combo = 0;
          setMessage('앗, 빗나갔어요!', '구멍을 잘 보고 다시 도전해보세요.');
          updateStats();
        }
      };

      holes.forEach(hole => hole.addEventListener('click', whack));
      startButton.addEventListener('click', startGame);
      updateStats();
    })();
  </script>
</body>
</html>
